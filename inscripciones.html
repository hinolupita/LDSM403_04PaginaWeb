<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/miEstilo.css">
    <title>Inscripciones | TechAcademy</title>
    <!-- Tipografía en línea -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div id="logo">
            <h1>TechAcademy</h1>
        </div>
        <nav class="navPrincipal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="cursos.html">Cursos</a></li>
                <li><a href="mentoría.html">Mentoría</a></li>
                <li><a href="inscripciones.html" id="btn_destacado">Inscripciones</a></li>
            </ul>
        </nav>
    </header>
    
    <main class="contenedor_principal">
        <section class="tec">
            <section class="tec_contenido">
                <h2>Inscríbete a tu siguiente curso</h2>
                <p>Completa el formulario oficial de registro para apartar tu lugar en la especialización elegida.</p>
            </section>
        </section>

        <section id="catalogoCursos" class="seccion-formulario">
            <div class="contenedor-formulario">
                <h2>Formulario de Inscripción</h2>
                
                <!-- El action apunta a la página que procesará y mostrará el éxito -->
                <form action="procesar_inscripcion.html" method="GET" class="form-inscripcion">
                    
                    <div class="campo-form">
                        <label for="nombre">Nombre Completo:</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>
                    </div>

                    <div class="campo-form">
                        <label for="email">Correo Electrónico:</label>
                        <input type="email" id="email" name="email" placeholder="Ej. correo@ejemplo.com" required>
                    </div>

                    <div class="campo-form">
                        <label for="telefono">Teléfono de Contacto:</label>
                        <input type="tel" id="telefono" name="telefono" placeholder="Ej. 4771234567" required>
                    </div>

                    <div class="campo-form">
                        <label for="curso">Selecciona el Curso:</label>
                        <select id="curso" name="curso" required>
                            <option value="" disabled selected>-- Elige una opción --</option>
                            <option value="ciberseguridad">Fundamentos de la Ciberseguridad (Google)</option>
                            <option value="ia">Inteligencia Artificial (Google Cloud)</option>
                            <option value="soporte">Soporte Técnico (Google)</option>
                            <option value="backend">Desarrollo Backend con APIs (Universidad Tech)</option>
                        </select>
                    </div>

                    <div class="campo-form">
                        <label>Nivel de Experiencia Previa:</label>
                        <div class="grupo-radio">
                            <label><input type="radio" name="experiencia" value="principiante" required> Principiante</label>
                            <label><input type="radio" name="experiencia" value="intermedio" required> Intermedio</label>
                            <label><input type="radio" name="experiencia" value="avanzado" required> Avanzado</label>
                        </div>
                    </div>

                    <div class="contenedor-btn">
                        <button type="submit" class="btn-enviar">Enviar Inscripción</button>
                    </div>

                </form>
            </div>
        </section>
    </main>

    <footer>
        <h6> &copy; 2026 TechAcademy </h6>
    </footer>
</body>
</html>
